name: Build Android APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease
        env:
          JDIH_STORE_FILE: ${{ secrets.JDIH_STORE_FILE }}
          JDIH_STORE_PASSWORD: ${{ secrets.JDIH_STORE_PASSWORD }}
          JDIH_KEY_ALIAS: ${{ secrets.JDIH_KEY_ALIAS }}
          JDIH_KEY_PASSWORD: ${{ secrets.JDIH_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: jdih-blora-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
